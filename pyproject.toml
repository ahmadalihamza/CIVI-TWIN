[project]
name = "civitwin-ai"
version = "0.1.0"
description = "CIVITWIN AI - synthetic, local-first public-service planning sandbox (hackathon MVP)"
requires-python = ">=3.11"
# Versions verified on the reference machine are recorded in docs/IMPLEMENTATION_STATUS.md.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",      # HiGHS MILP fallback backend
]

[project.optional-dependencies]
cpsat = ["ortools>=9.10"]   # preferred solver backend (SRS §3.2)
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services/api"]
include = ["civitwin_engine*", "civitwin_api*"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
